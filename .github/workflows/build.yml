name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            dist: dist:mac
            artifacts: dist/*.dmg
            exe: dist/mac-arm64/Playwright Workbench.app/Contents/MacOS/Playwright Workbench
          - os: windows-latest
            dist: dist:win
            artifacts: dist/*.exe
            exe: dist/win-unpacked/Playwright Workbench.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: End-to-End-Tests
        run: npm test

      - name: Installer bauen
        run: npm run ${{ matrix.dist }} -- --publish never

      - name: End-to-End-Tests gegen gepackte App
        shell: bash
        run: |
          export PW_WORKBENCH_EXE="$GITHUB_WORKSPACE/${{ matrix.exe }}"
          test -f "$PW_WORKBENCH_EXE"
          npm test

      - uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifacts }}

      - name: Release Notes mit Versionen erzeugen
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-notes.js

      - name: Release anhängen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ matrix.artifacts }}
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
